<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BB RENTALS - Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="account-page">


    <!-- =====================================
         LEFT SIDE
    ====================================== -->

    <div class="account-left">


        <!-- LOGO -->

        <div class="account-logo">

            <a href="index.html">
                BB <span>RENTALS</span>
            </a>

        </div>


        <!-- BACK TO HOME -->

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>


        <!-- LEFT CONTENT -->

        <div class="account-left-content">

            <p class="small-title">
                PREMIUM CAR RENTALS
            </p>
            <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BB RENTALS - Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>

            <h1>
                Your Journey<br>
                Starts Here.
            </h1>

            <p class="left-description">
                Create your account and start your
                premium driving experience.
            </p>

        </div>

    </div>



    <!-- =====================================
         RIGHT SIDE
    ====================================== -->

    <div class="account-right">


        <div class="account-form-container">


            <!-- CREATE ACCOUNT HEADING -->

            <div class="account-heading">

                <p class="welcome-text">
                    NEW USER
                </p>

                <h2>
                    Create <span>BB RENTALS</span> Account
                </h2>

                <p>
                    Enter your details to create your account.
                </p>

            </div>



            <!-- CREATE ACCOUNT FORM -->

          <form onsubmit="createAccount(event)">

    <div class="form-group">

        <label for="username">
            User Name
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your user name"
            required
        >

    </div>


    <div class="form-group">

        <label for="new-email">
            Email Address
        </label>

        <input
            type="email"
            id="new-email"
            name="email"
            placeholder="Enter your email"
            required
        >

    </div>


    <div class="form-group">

        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

    </div>


    <div class="form-group">

        <label for="new-password">
            Create Password
        </label>

        <input
            type="password"
            id="new-password"
            name="password"
            placeholder="Create your password"
            required
        >

    </div>


    <div class="form-group">

        <label for="confirm-password">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm your password"
            required
        >

    </div>


    <button
        type="submit"
        class="login-button"
    >
        Create Account →
    </button>

</form>  



            <!-- LOGIN LINK -->

            <p class="create-account-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>

    </div>

</div>

<script src="script.js"></script>
</body>

</html>
